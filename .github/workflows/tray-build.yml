name: tray-build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# least privilege: tauri-action only needs to draft a release + upload assets
permissions:
  contents: write

jobs:
  build:
    # macOS only: LARIS transcribes with mlx-whisper (Apple Silicon) and the
    # tray drives macOS-specific TCC and menu-bar APIs. The Windows port has
    # its own fork.
    runs-on: macos-latest
    steps:
      # actions pinned by commit SHA (a moved tag can ship malicious code) -
      # comments track the human-readable version
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # SHA pin loses the channel that the @stable tag name normally carries,
      # so the toolchain must be named explicitly
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master @ 2026-07-17
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: apps/tray/src-tauri

      - name: Install frontend deps
        working-directory: apps/tray
        run: npm install

      - name: Rust tests
        working-directory: apps/tray/src-tauri
        run: cargo test

      # On tag pushes this drafts a GitHub release with the installers
      # (.dmg); on manual dispatch it only builds.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/tray
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('VOXIS {0}', github.ref_name) || '' }}
          releaseDraft: true

      - name: Upload installers (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxis-tray-macos
          path: |
            apps/tray/src-tauri/target/release/bundle/dmg/*.dmg
            apps/tray/src-tauri/target/release/bundle/macos/*.app/**
          if-no-files-found: warn
