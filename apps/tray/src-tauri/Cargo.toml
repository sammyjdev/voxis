[package]
name = "tray"
version = "0.1.0"
description = "VOXIS tray - control surface for LARIS (dictation) and MIRIS (meetings)"
authors = ["sammyjdev"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
chrono = "0.4"
toml_edit = "0.22"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows has no `ps`: sysinfo reads another process's command line
[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# toasts under VOXIS's own AppUserModelID (the plugin falls back to
# PowerShell's id outside an installed app) and the live "recording" toast
tauri-winrt-notification = "0.7"
windows = { version = "0.61", features = ["UI_Notifications", "Foundation_Collections", "Data_Xml_Dom"] }

# macOS mic prompt: only VOXIS.app's own signed bundle binary can present the
# TCC dialog (a spawned bundle-less Python helper cannot), so the tray requests
# it via AVFoundation. Versions match what tauri already pulls in transitively.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }

[dev-dependencies]
tempfile = "3"

